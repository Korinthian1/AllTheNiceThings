#World generation options
[worldgen]
	#If true, cobalt ore generates in the Nether.
	genCobalt = true
	#Approximate cobalt veins per Nether chunk.
	# Default: 20
	# Range: 0 ~ 256
	cobaltRate = 20
	#If true, ardite ore generates in the Nether.
	genArdite = true
	#Approximate ardite veins per Nether chunk.
	# Default: 20
	# Range: 0 ~ 256
	arditeRate = 20
	#If true, Track B's self-contained ore ladder (fulmenite, duskspar, 
	#voltcinder, murkiron, hardcinder, nightshale, warspar, hollowstone, resonite, 
	#starfall_stone, voidglass) generates in the world.
	genTrackBOres = true
	#If true slime islands will generate.
	generateSlimeIslands = true
	#If true slime islands generate in superflat worlds.
	generateIslandsInSuperflat = false
	#One in every X chunks will contain a slime island. Values below 81 are capped
	#at one in 81, the density of the island structure set's candidate grid.
	# Default: 730
	# Range: 0 ~ 100000
	slimeIslandRate = 730
	#One in every X chunks will contain a magma island in the nether. Values below 81
	#are capped at one in 81, the density of the island structure set's candidate grid.
	# Default: 100
	# Range: 0 ~ 100000
	magmaIslandRate = 100
	#Prevents generation of slime islands in the listed dimensions.
	slimeIslandBlacklist = ["minecraft:the_nether", "minecraft:the_end"]
	#If false, slime islands only generate in dimensions which are of type surface. This
	#means they won't generate in modded cave dimensions. Note that the name of this property
	#is inverted: it must be set to false to prevent slime islands from generating in
	#non-surface dimensions.
	slimeIslandsOnlyGenerateInSurfaceWorlds = true
