#If true, tools and tool parts show additional info in their tooltips while Shift is held.
extraTooltips = true
#If true, all material variants of every tool part are listed in creative. Set to false to
#list only the first material for each part.
listAllPartMaterials = true
#If true, a retextured variant of the Stencil Table and Part Builder is listed in creative
#for every plank/log. Set to false to list only the default-textured block.
listAllTables = true
#If true, the Crafting Station, Stencil Table, Part Builder and Tool Station draw whatever
#is in their input slots lying on their top. Set to false to render these stations bare.
renderTableItems = true
#How the shortbow, longbow and crossbow are held, in every draw state. CLASSIC is
#the original 1.12-era pose; MODERN is vanilla 1.21.1's own bow/crossbow pose.
#Allowed Values: CLASSIC, MODERN
heldBowPose = "CLASSIC"
#What the Tool Station, Tool Forge and Modifier Worktable preview their result on.
#ARMOR_STAND is an armor stand; PLAYER is your own character, in your skin.
#Allowed Values: ARMOR_STAND, PLAYER
stationPreviewModel = "ARMOR_STAND"
#If true, a trait firing draws a small particle and plays a quiet sound. Set to false to
#see and hear nothing when a trait fires.
traitFeedback = true
