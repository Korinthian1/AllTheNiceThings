[modules]
	#Set this to false to disable the Botania Extras module. A disabled module registers no blocks, items, recipes, Lexicon entries or client rendering. Requires a game restart.
	botania_extras = true
	#Set this to true to enable the Skybox module. A disabled module registers no blocks, items, recipes, Lexicon entries or client rendering. Requires a game restart.
	skybox = false
	#Set this to false to disable the Exploration module. A disabled module registers no blocks, items, recipes, Lexicon entries or client rendering. Requires a game restart.
	exploration = true
	#Set this to false to disable the Creative Crafting module. A disabled module registers no blocks, items, recipes, Lexicon entries or client rendering. Requires a game restart.
	creative = true
	#Set this to false to disable the Asgard module. A disabled module registers no blocks, items, recipes, Lexicon entries or client rendering. Requires a game restart.
	asg = true
	#Set this to false to disable the Sophisticated module. A disabled module registers no blocks, items, recipes, Lexicon entries or client rendering. Requires a game restart.
	sophisticated = true
