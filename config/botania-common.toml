[loonium]
	#LOOT: the Loonium drops dungeon and structure loot directly as items (Botania 1.7.10 behavior). MOBS: the Loonium spawns monsters that carry the loot and drop it when killed.
	#Allowed Values: LOOT, MOBS
	mode = "LOOT"
	#Mana spent per cycle in LOOT mode.
	# Default: 35000
	# Range: 1 ~ 10000000
	lootManaCost = 35000
	#Ticks between cycles in LOOT mode.
	# Default: 200
	# Range: 1 ~ 1200000
	lootCooldown = 200
	#Items dropped per cycle in LOOT mode.
	# Default: 1
	# Range: 1 ~ 64
	lootItemsPerCycle = 1
	#Drop radius in blocks in LOOT mode.
	# Default: 3
	# Range: 1 ~ 16
	lootRange = 3

