#Rendering & Performance Toggles
[rendering]
	#Show ghost blocks for active construction jobs
	showConstructionGhosts = true
	#Show ghost block preview while browsing schematics
	showSchematicPreview = true
	#Show beehive range overlay when looking at a hive
	showBeehiveRange = true
	#Opacity for all ghost block rendering (0.05 = nearly invisible, 1.0 = fully opaque)
	# Default: 0.5
	# Range: 0.05 ~ 1.0
	ghostBlockOpacity = 0.5
	#Render block entities (chests, signs, gearboxes, etc.) in ghost previews. Disable for better performance on large schematics.
	renderGhostBlockEntities = false
	#Maximum number of block entities to render per ghost preview, including belts. Lower values improve performance.
	# Default: 256
	# Range: 1 ~ 1024
	maxGhostBlockEntities = 256
	#Maximum distance (blocks) at which bees are rendered. Lower for better FPS with many bees.
	# Default: 64
	# Range: 16 ~ 256
	beeRenderDistance = 64
	#Maximum distance (blocks) at which carried items on bumble bees are rendered.
	# Default: 24
	# Range: 8 ~ 64
	beeItemRenderDistance = 24
	#Maximum number of bees rendered at once. When more are in view, only the nearest ones are drawn. Lower for better FPS with many bees.
	# Default: 512
	# Range: 0 ~ 8192
	maxRenderedBees = 512

#Planners
[planners]
	#Keep the area selection when you switch to another item or planner and back
	keepSelectionBetweenPlanners = true
